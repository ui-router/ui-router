jobs:
  reproducibility:
    name: Two clean archive workspaces
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 180
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Trust checked-out worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Install pinned npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
