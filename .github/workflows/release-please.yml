name: Release proposals
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release-prs:
    # Setting up the app does not enable the bot until this variable is set.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix .github/release-please --ignore-scripts --no-audit --no-fund
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # The runner calls only createPullRequests(): no tags, releases, or publications.
      - run: node .github/release-please/run.mjs
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app.outputs.token }}
