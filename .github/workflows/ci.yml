name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  HUSKY: '0'
  LC_ALL: C
  TZ: UTC
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  CYPRESS_CACHE_FOLDER: /root/.cache/Cypress
  CHROME_BIN: /ms-playwright/chromium-1234/chrome-linux64/chrome
jobs:
  source:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      - run: "npm run verify:tooling-versions"
      - run: "npm run lint -- --cache=local:"
      - run: "npm run typecheck -- --cache=local:"
      - run: "npm test -- --cache=local: --env-mode=loose"
      - run: "npm run test:release"
  packages:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      - run: "npm run pack -- --cache=local:"
      - run: "npm run test:packages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages
          include-hidden-files: true
          path: |
            core/.artifacts/packages/*.tgz
            frameworks/*/uirouter-*/.artifacts/packages/*.tgz
            plugins/*/.artifacts/packages/*.tgz
            tools/publish-scripts/.artifacts/packages/*.tgz
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      - run: "npm run build -- --cache=local:"
      - run: "node tools/prepare-workspace-browser.mjs"
      - run: "npm run setup:browser -- --concurrency=1 --cache=local:"
      - run: "npm run e2e -- --concurrency=1 --cache=local:"
      - if: always()
        run: node tools/prepare-workspace-browser.mjs --cleanup
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures
          path: |
            **/test-results/**
            **/playwright-report/**
            **/cypress/screenshots/**
            **/cypress/videos/**
  docs:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      - run: "npm run docs:verify"
  integration:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 90
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        shard: [core, angular, angularjs, react, react-hybrid]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: "npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund"
      - run: "npm ci --ignore-scripts --no-audit --no-fund"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages
          path: .
      - run: "npm run test:consumers -- ${{ matrix.shard }}"
      - if: matrix.shard == 'react' || matrix.shard == 'react-hybrid'
        run: "npm run test:consumers -- ${{ matrix.shard }} --minimum"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ matrix.shard }}-failures
          path: /tmp/uirouter-consumers-*/**/test-results/**
  required:
    name: Required
    if: always()
    needs: [source, packages, browser, docs, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
